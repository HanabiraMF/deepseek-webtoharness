<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件中心 - DeepSeek WebtoHarness</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span data-icon="logo"></span> WebtoHarness
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="plugins.html" class="active">插件中心</a>
        <a href="https://github.com/HanabiraMF/deepseek-webtoharness" target="_blank" class="nav-gh">
          <span data-icon="github"></span> GitHub
        </a>
      </div>
    </div>
  </nav>

  <header class="hero" style="padding: 80px 0 40px;">
    <div class="container">
      <h1 class="animate" style="font-size: clamp(2.2rem, 5vw, 3.2rem);">官方插件中心</h1>
      <p class="lead animate d1" style="margin-bottom: 0;">18 项开箱即用的原生插件。下载后放入本地 plugins/ 目录，重启服务即生效。</p>
    </div>
  </header>

  <section class="container" style="padding-bottom: 80px;">
    <div class="plugins-toolbar animate d1">
      <div class="search-wrap">
        <span data-icon="search"></span>
        <input type="text" id="search-input" class="search-input" placeholder="搜索插件名称、功能或 ID...">
      </div>
      <div class="filter-chips" id="filter-chips"></div>
    </div>

    <div class="plugins-count" id="plugins-count"></div>
    <div class="grid grid-3" id="plugins-grid"></div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <span data-icon="search"></span>
      <p>没有找到匹配的插件，试试其他关键词。</p>
    </div>

    <div style="margin-top: 70px;">
      <div class="section-head" style="margin-bottom: 30px;">
        <h2 class="section-title" style="font-size: 1.6rem;">社区插件</h2>
        <p class="section-desc">想让 AI 获得更多能力？你可以用一句话让 AI 自己写。</p>
      </div>
      <div class="tech-card" style="max-width: 860px; margin: 0 auto;">
        <h3><span data-icon="puzzle"></span> 让 AI 自己写一个插件</h3>
        <p>直接在对话里说：「帮我写一个插件，功能是 XXX，然后注册它」。AI 会调用 <code style="background:rgba(255,255,255,0.07);padding:2px 6px;border-radius:4px;color:var(--primary);font-size:0.88rem;">register_plugin</code> 当场生成并挂载，立即可用。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-outline" onclick="copyText('帮我写一个前端插件，功能是【在此描述你的需求】。请用 register_plugin 注册它，并告诉我怎么调用。', this)">
            <span data-icon="copy"></span> 复制提示词
          </button>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>Made with <span class="heart" data-icon="heart"></span> for DeepSeek Web &copy; 2026 <a href="https://github.com/HanabiraMF" target="_blank">HanabiraMF</a></p>
    </div>
  </footer>

  <script src="assets/icons.js"></script>
  <script src="assets/plugins-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      const RAW_BASE = 'https://raw.githubusercontent.com/HanabiraMF/deepseek-webtoharness/main/plugins/';
      let currentCat = '全部';
      let keyword = '';

      const grid = document.getElementById('plugins-grid');
      const chipsWrap = document.getElementById('filter-chips');
      const countEl = document.getElementById('plugins-count');
      const emptyEl = document.getElementById('empty-state');
      const searchInput = document.getElementById('search-input');

      function renderChips() {
        chipsWrap.innerHTML = '';
        window.CATEGORIES.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'chip' + (cat === currentCat ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', () => { currentCat = cat; renderChips(); renderGrid(); });
          chipsWrap.appendChild(btn);
        });
      }

      function match(p) {
        if (currentCat !== '全部' && p.cat !== currentCat) return false;
        if (!keyword) return true;
        const k = keyword.toLowerCase();
        return p.name.toLowerCase().includes(k) || p.id.toLowerCase().includes(k) || p.desc.toLowerCase().includes(k) || p.cat.toLowerCase().includes(k);
      }

      function renderGrid() {
        const list = window.PLUGINS.filter(match);
        grid.innerHTML = '';
        countEl.textContent = '共 ' + list.length + ' 个插件';

        if (!list.length) {
          emptyEl.style.display = 'block';
          grid.style.display = 'none';
          return;
        }
        emptyEl.style.display = 'none';
        grid.style.display = 'grid';

        list.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = 'plugin-card animate';
          card.style.animationDelay = Math.min(idx * 0.03, 0.3) + 's';

          const iconSvg = (window.ICONS[p.icon] || window.ICONS.puzzle);

          card.innerHTML = [
            '<div class="plugin-head">',
            '  <div class="card-icon">' + iconSvg + '</div>',
            '  <div class="plugin-title">',
            '    <h3>' + escapeHtml(p.name) + '</h3>',
            '    <div class="plugin-id">' + escapeHtml(p.id) + '</div>',
            '  </div>',
            '  <span class="plugin-cat">' + escapeHtml(p.cat) + '</span>',
            '</div>',
            '<div class="plugin-desc">' + escapeHtml(p.desc) + '</div>',
            '<div class="plugin-usage">' + escapeHtml(p.usage) + '</div>',
            '<div class="plugin-actions">',
            '  <a class="btn btn-sm btn-primary" href="' + RAW_BASE + encodeURIComponent(p.id) + '.js" target="_blank" rel="noopener">' + window.ICONS.download + ' 下载</a>',
            '  <button class="btn btn-sm btn-outline" data-copy="' + escapeAttr(p.id) + '">' + window.ICONS.copy + ' 复制用法</button>',
            '</div>'
          ].join('');

          const copyBtn = card.querySelector('[data-copy]');
          copyBtn.addEventListener('click', () => copyText(p.usage, copyBtn));

          grid.appendChild(card);
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      searchInput.addEventListener('input', (e) => {
        keyword = e.target.value.trim();
        renderGrid();
      });

      renderChips();
      renderGrid();
    })();
  </script>
</body>
</html>
