<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件中心 - DeepSeek WebtoHarness</title>
    <style>
/* ===== DeepSeek WebtoHarness 设计系统 ===== */
:root {
  --bg-base: #08080a;
  --bg-elev: #0e0e12;
  --bg-card: rgba(22, 22, 28, 0.65);
  --bg-card-hover: rgba(32, 32, 40, 0.85);
  --text-main: #f5f5f7;
  --text-muted: #9a9aa5;
  --text-dim: #66666f;
  --primary: #5686fe;
  --primary-strong: #3964fe;
  --primary-glow: rgba(86, 134, 254, 0.16);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.18);
  --ok: #4ade80;
  --warn: #fbbf24;
  --err: #f87171;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-main);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); }

/* 背景 */

.container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }
.section { padding: 90px 0; }
.section-head { text-align: center; margin-bottom: 54px; }
.section-title {
  font-size: 2.1rem; font-weight: 750; letter-spacing: -0.02em;
  color: var(--text-main);
}
.section-desc { color: var(--text-muted); font-size: 1.08rem; margin-top: 12px; max-width: 640px; margin-left: auto; margin-right: auto; }

/* 导航 */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8, 8, 10, 0.72);
  border-bottom: 1px solid var(--border);
}
.nav-inner { max-width: 1140px; margin: 0 auto; padding: 0 24px; height: 62px; display: flex; align-items: center; gap: 20px; }
.nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em; }
.nav-logo svg { width: 22px; height: 22px; color: var(--primary); }
.nav-links { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.nav-links a {
  padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.92rem; color: var(--text-muted);
  transition: color .18s, background .18s;
}
.nav-links a:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
.nav-links a.active { color: var(--text-main); }
.nav-gh { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); }
.nav-gh:hover { border-color: var(--border-hover); }
.nav-gh svg { width: 16px; height: 16px; }
@media (max-width: 760px) {
  .nav-links a:not(.nav-gh) { display: none; }
}

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; border-radius: var(--radius-md); font-size: 0.98rem; font-weight: 550;
  cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: all .2s;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%); color: #fff; }

.btn-outline { background: transparent; color: var(--text-main); border-color: var(--border); }
.btn-outline:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.04); }
.btn-sm { padding: 8px 14px; font-size: 0.88rem; border-radius: var(--radius-sm); }
.btn-sm svg { width: 15px; height: 15px; }

/* 徽章 */
.badge {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--bg-card); font-size: 0.84rem; color: var(--text-muted);
}
.badge svg { width: 14px; height: 14px; color: var(--primary); }
.badge .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* Hero */
.hero { padding: 110px 0 70px; text-align: center; }
.hero h1 {
  font-size: clamp(2.6rem, 6vw, 4.4rem); font-weight: 850; letter-spacing: -0.03em; line-height: 1.06;
  margin: 26px 0 22px;
  color: var(--text-main);
}
.hero .lead { font-size: 1.22rem; color: var(--text-muted); max-width: 640px; margin: 0 auto 38px; }
.hero-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.hero-meta { margin-top: 26px; font-size: 0.85rem; color: var(--text-dim); display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta svg { width: 14px; height: 14px; color: var(--text-muted); }

/* 卡片网格 */
.grid { display: grid; gap: 18px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr; } .grid-2 { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 28px; transition: all .25s; position: relative; overflow: hidden;
}
.card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.card-icon {
  width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  background: rgba(86,134,254,0.1); border: 1px solid rgba(86,134,254,0.2); margin-bottom: 18px;
}
.card-icon svg { width: 23px; height: 23px; color: var(--primary); }
.card h3 { font-size: 1.12rem; font-weight: 650; margin-bottom: 9px; }
.card p { font-size: 0.95rem; color: var(--text-muted); }

/* 特性大卡（黑科技） */
.tech-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 900px) { .tech-grid { grid-template-columns: 1fr; } }
.tech-card {
  background: linear-gradient(160deg, rgba(22,22,28,0.9) 0%, rgba(10,10,13,0.85) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 36px;
  position: relative; overflow: hidden;
}

.tech-card h3 { font-size: 1.32rem; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.tech-card h3 svg { width: 24px; height: 24px; color: var(--primary); }
.tech-card > p { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 22px; }
.code-window {
  background: #040406; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden;
  font-family: var(--font-mono); font-size: 0.82rem;
}
.code-head {
  background: rgba(255,255,255,0.03); padding: 9px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-family: var(--font-sans); font-size: 0.78rem;
}
.code-dot { width: 10px; height: 10px; border-radius: 50%; }
.code-dot.r { background: #ff5f56; } .code-dot.y { background: #ffbd2e; } .code-dot.g { background: #27c93f; }
.code-body { padding: 16px; overflow-x: auto; line-height: 1.7; color: #a8a8b4; }
.code-body .kw { color: #c678dd; } .code-body .str { color: #98c379; }
.code-body .fn { color: #61afef; } .code-body .cmt { color: #5c6370; font-style: italic; }

/* 步骤 */
.steps { display: flex; flex-direction: column; gap: 22px; max-width: 760px; margin: 0 auto; }
.step { display: flex; gap: 20px; }
.step-num {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--bg-card);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-weight: 650; font-size: 0.92rem; color: var(--primary);
}
.step-body h4 { font-size: 1.06rem; font-weight: 600; margin-bottom: 5px; }
.step-body p { color: var(--text-muted); font-size: 0.95rem; }
.step-body code { background: rgba(255,255,255,0.07); padding: 2px 7px; border-radius: 5px; font-size: 0.86rem; color: var(--primary); }

/* 插件中心 */
.plugins-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 30px; }
.search-wrap {
  flex: 1; min-width: 240px; position: relative; display: flex; align-items: center;
}
.search-wrap svg { position: absolute; left: 14px; width: 17px; height: 17px; color: var(--text-dim); pointer-events: none; }
.search-input {
  width: 100%; padding: 11px 16px 11px 42px; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-main); font-size: 0.95rem; font-family: inherit; outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--primary); }
.search-input::placeholder { color: var(--text-dim); }
.filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 8px 15px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-muted); font-size: 0.87rem; cursor: pointer; transition: all .18s; font-family: inherit;
}
.chip:hover { border-color: var(--border-hover); color: var(--text-main); }
.chip.active { background: var(--primary-glow); border-color: rgba(86,134,254,0.45); color: var(--primary); }
.plugins-count { font-size: 0.86rem; color: var(--text-dim); margin-bottom: 20px; }

.plugin-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 22px; display: flex; flex-direction: column; gap: 14px; transition: all .25s;
}
.plugin-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.plugin-head { display: flex; align-items: flex-start; gap: 13px; }
.plugin-head .card-icon { margin-bottom: 0; width: 42px; height: 42px; }
.plugin-head .card-icon svg { width: 21px; height: 21px; }
.plugin-title { flex: 1; }
.plugin-title h3 { font-size: 1.04rem; font-weight: 650; margin-bottom: 2px; }
.plugin-id { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); }
.plugin-cat {
  font-size: 0.72rem; padding: 2px 9px; border-radius: 100px; background: rgba(86,134,254,0.12);
  color: var(--primary); white-space: nowrap; align-self: flex-start;
}
.plugin-desc { font-size: 0.91rem; color: var(--text-muted); flex: 1; }
.plugin-usage {
  font-family: var(--font-mono); font-size: 0.78rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 12px; color: #9a9aa5; overflow-x: auto; white-space: pre;
}
.plugin-actions { display: flex; gap: 8px; margin-top: 2px; }
.plugin-actions .btn { flex: 1; }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state svg { width: 42px; height: 42px; margin-bottom: 14px; opacity: 0.5; }

/* FAQ */
.faq { max-width: 780px; margin: 0 auto; }
.faq-item { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-card); margin-bottom: 12px; overflow: hidden; }
.faq-q { padding: 18px 22px; font-weight: 550; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.faq-q svg { width: 18px; height: 18px; color: var(--text-muted); transition: transform .25s; flex-shrink: 0; }
.faq-item.open .faq-q svg { transform: rotate(180deg); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
.faq-item.open .faq-a { max-height: 400px; }
.faq-a-inner { padding: 0 22px 20px; color: var(--text-muted); font-size: 0.94rem; }

/* CTA */
.cta-box {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 58px 40px; text-align: center; position: relative; overflow: hidden;
}

.cta-box h2 { font-size: 2rem; font-weight: 750; margin-bottom: 12px; }
.cta-box p { color: var(--text-muted); margin-bottom: 30px; }
.cta-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* 页脚 */
.footer { border-top: 1px solid var(--border); padding: 44px 0 36px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
.footer a { color: var(--text-main); border-bottom: 1px dotted var(--text-dim); transition: color .2s; }
.footer a:hover { color: var(--primary); border-color: var(--primary); }
.footer .heart { width: 14px; height: 14px; display: inline; color: #ef4444; vertical-align: middle; margin: 0 2px; }
.footer .disclaimer { margin-top: 14px; font-size: 0.8rem; color: var(--text-dim); }

/* 动画 */
@keyframes fadeUp { from { opacity: 0; } to { opacity: 1; } }

.d1 { } .d2 { } .d3 { }

</style>
</head>

        </div>
      </div>

  <script>
// ===== 通用交互逻辑 =====

// 复制到剪贴板
function copyText(text, btn) {
  const done = () => {
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.innerHTML = (window.ICONS.check || '') + ' 已复制';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb && cb(); } catch (e) {}
  document.body.removeChild(ta);
}

// FAQ 手风琴
function initFaq() {
  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-q');
    if (!q) return;
    q.addEventListener('click', () => item.classList.toggle('open'));
  });
}

// 注入图标占位
function injectIcons() {
  document.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    if (window.ICONS && window.ICONS[name]) el.innerHTML = window.ICONS[name];
  });
}

document.addEventListener('DOMContentLoaded', () => {
  injectIcons();
  initFaq();
});

</script>
  <script>
    (function () {
      const RAW_BASE = 'https://raw.githubusercontent.com/HanabiraMF/deepseek-webtoharness/main/plugins/';
      let currentCat = '全部';
      let keyword = '';

      const grid = document.getElementById('plugins-grid');
      const chipsWrap = document.getElementById('filter-chips');
      const countEl = document.getElementById('plugins-count');
      const emptyEl = document.getElementById('empty-state');
      const searchInput = document.getElementById('search-input');

      function renderChips() {
        chipsWrap.innerHTML = '';
        window.CATEGORIES.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'chip' + (cat === currentCat ? ' active' : '');
          btn.textContent = cat;
          btn.addEventListener('click', () => { currentCat = cat; renderChips(); renderGrid(); });
          chipsWrap.appendChild(btn);
        });
      }

      function match(p) {
        if (currentCat !== '全部' && p.cat !== currentCat) return false;
        if (!keyword) return true;
        const k = keyword.toLowerCase();
        return p.name.toLowerCase().includes(k) || p.id.toLowerCase().includes(k) || p.desc.toLowerCase().includes(k) || p.cat.toLowerCase().includes(k);
      }

      function renderGrid() {
        const list = window.PLUGINS.filter(match);
        grid.innerHTML = '';
        countEl.textContent = '共 ' + list.length + ' 个插件';

        if (!list.length) {
          emptyEl.style.display = 'block';
          grid.style.display = 'none';
          return;
        }
        emptyEl.style.display = 'none';
        grid.style.display = 'grid';

        list.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = 'plugin-card animate';
          card.style.animationDelay = Math.min(idx * 0.03, 0.3) + 's';

          const iconSvg = (window.ICONS[p.icon] || window.ICONS.puzzle);

          card.innerHTML = [
            '<div class="plugin-head">',
            '  <div class="card-icon">' + iconSvg + '</div>',
            '  <div class="plugin-title">',
            '    <h3>' + escapeHtml(p.name) + '</h3>',
            '    <div class="plugin-id">' + escapeHtml(p.id) + '</div>',
            '  </div>',
            '  <span class="plugin-cat">' + escapeHtml(p.cat) + '</span>',
            '</div>',
            '<div class="plugin-desc">' + escapeHtml(p.desc) + '</div>',
            '<div class="plugin-usage">' + escapeHtml(p.usage) + '</div>',
            '<div class="plugin-actions">',
            '  <a class="btn btn-sm btn-primary" href="' + RAW_BASE + encodeURIComponent(p.id) + '.js" target="_blank" rel="noopener">' + window.ICONS.download + ' 下载</a>',
            '  <button class="btn btn-sm btn-outline" data-copy="' + escapeAttr(p.id) + '">' + window.ICONS.copy + ' 复制用法</button>',
            '</div>'
          ].join('');

          const copyBtn = card.querySelector('[data-copy]');
          copyBtn.addEventListener('click', () => copyText(p.usage, copyBtn));

          grid.appendChild(card);
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      searchInput.addEventListener('input', (e) => {
        keyword = e.target.value.trim();
        renderGrid();
      });

      renderChips();
      renderGrid();
    })();
  </script>
